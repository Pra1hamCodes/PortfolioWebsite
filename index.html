<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#245edb">
  <title>Prathmesh Pandey - Windows XP Portfolio</title>
  <link rel="stylesheet" href="styles/xp.css">
</head>
<body>
  <div id="bootScreen" class="screen-layer" role="dialog" aria-label="Windows XP startup">
    <div class="boot-panel">
      <div class="microsoft"><span class="windows-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Microsoft</div>
      <div class="xp-word">windows<small>XP</small></div>
      <p>Prathmesh Portfolio Edition</p>
      <div class="boot-progress" aria-hidden="true"><span></span></div>
      <button class="boot-skip" id="skipBoot">Skip startup</button>
    </div>
  </div>

  <main id="desktop" hidden>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="desktop-icons" id="desktopIcons" aria-label="Desktop icons"></div>
    <div id="windowLayer" aria-live="polite"></div>
    <nav id="startMenu" aria-label="Start menu" hidden>
      <header class="start-header"><img class="avatar" src="PHOTO.png" alt="Prathmesh Pandey"><div><strong>Prathmesh Pandey</strong><small>Portfolio Edition</small></div></header>
      <div class="start-columns"><section class="start-pane start-programs-pane"><h2>Programs</h2><div id="startPrograms"></div></section><section class="start-pane start-system" id="startSystem"><h2>Places</h2></section></div>
      <footer><span class="start-footer-note">All Programs</span><button id="logoffButton" data-action="logoff"><span aria-hidden="true">↪</span> Log Off</button></footer>
    </nav>
    <aside id="contextMenu" aria-label="Desktop context menu" hidden>
      <button data-action="new">New</button><button data-action="refresh">Refresh</button><hr><button data-action="view">View</button><button data-action="arrange">Arrange Icons By Name</button><button data-action="properties">Properties</button>
    </aside>
    <footer id="taskbar">
      <button id="startButton" class="start-button" aria-expanded="false"><span class="start-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span>start</button><div id="quickLaunch" class="quick-launch" aria-label="Quick Launch"></div>
      <div id="taskButtons" class="task-buttons"></div>
      <div class="tray"><button id="soundButton" aria-label="Toggle sound">&#128266;</button><span class="tray-signal" aria-label="Network connected"><i></i><i></i><i></i></span><span id="networkState">online</span><span class="tray-divider"></span><time id="clock"></time></div>
    </footer>
  </main>

  <div id="xpDialog" class="xp-dialog-backdrop" hidden><section class="xp-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-titlebar"><strong id="dialogTitle">Windows XP</strong><button id="dialogClose" aria-label="Close">x</button></div><div class="dialog-content"><span id="dialogIcon" class="dialog-icon">i</span><p id="dialogMessage"></p></div><div class="dialog-actions"><button id="dialogCancel">Cancel</button><button id="dialogOk" class="default-button">OK</button></div></section></div>
  <div id="screensaver" hidden><div class="screensaver-logo">windows<small>XP</small></div><p>Move the mouse or press a key to return</p></div>
  <script src="scripts/app.js"></script>
</body>
</html>
